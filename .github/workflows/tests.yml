name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml pytest
      # CPU-only PyTorch, so the federated tests run instead of being skipped
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest
